<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATCHCATCH</title>
<style>
  html,body{height:100%;margin:0;background:#1b2433;color:#eef3f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:24px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{opacity:.8;margin:0 0 20px;white-space:pre-line}
  a.btn{display:inline-block;margin:6px;padding:12px 20px;border-radius:10px;
    background:#e8b84a;color:#1b2433;text-decoration:none;font-weight:700}
  a.btn.alt{background:#eef3f8;color:#1b2433}
</style>
</head>
<body>
<div class="box">
  <h1>CATCHCATCH 🔍</h1>
  <p>Redirecting you to the store…</p>
  <div id="fallback" style="display:none">
    <a class="btn" id="androidLink">Google Play</a>
    <a class="btn alt" id="iosLink">App Store</a>
  </div>
</div>
<script>
(function () {
  // ---- CONFIG ---------------------------------------------------------------
  var PLAY_ID = "me.energypotion.cc";
  var APPSTORE_URL = "https://apps.apple.com/app/id6804225701"; // region-neutral (auto-redirects to viewer's country store)

  // Campaign tag comes from ?c=... on the link you paste in each post.
  var params = new URLSearchParams(location.search);
  var campaign = params.get("c") || "direct";

  // Play Store install-referrer (shows up in Play Console > Acquisition).
  //
  // Source and medium follow the campaign. Add a row here for each new channel;
  // anything unmapped falls back to the campaign name with medium=social.
  var CHANNELS = {
    tiktok:         { source: "tiktok",    medium: "social" },
    youtube_shorts: { source: "youtube",   medium: "shorts" },
    youtube_long:   { source: "youtube",   medium: "video" },
    instagram:      { source: "instagram", medium: "social" },
    x:              { source: "x",         medium: "social" }
  };
  var ch = CHANNELS[campaign] || { source: campaign, medium: "social" };

  var referrer = encodeURIComponent(
    "utm_source=" + ch.source + "&utm_medium=" + ch.medium + "&utm_campaign=" + campaign
  );
  var playUrl = "https://play.google.com/store/apps/details?id=" + PLAY_ID +
                "&referrer=" + referrer;

  var ua = navigator.userAgent || navigator.vendor || "";
  var isAndroid = /android/i.test(ua);
  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // The line above the buttons, in the phone's language (English otherwise).
  // The buttons keep the stores' own names.
  var MSG = {
    en: { wait: "Redirecting you to the store…",
          tap: "Tap to open the store:",
          tapInApp: "Tap to open the store.\nNot opening? Use ⋮ → Open in browser.",
          choose: "Choose your store:" },
    ko: { wait: "스토어로 이동하는 중…",
          tap: "눌러서 스토어를 여세요",
          tapInApp: "눌러서 스토어를 여세요.\n열리지 않으면 ⋮ → 브라우저에서 열기",
          choose: "스토어를 고르세요" },
    ja: { wait: "ストアへ移動しています…",
          tap: "タップしてストアを開いてください",
          tapInApp: "タップしてストアを開いてください。\n開かないときは ⋮ →「ブラウザで開く」",
          choose: "ストアを選んでください" }
  };
  var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").slice(0, 2).toLowerCase();
  var msg = MSG[lang] || MSG.en;
  document.documentElement.lang = MSG[lang] ? lang : "en";
  document.querySelector("p").textContent = msg.wait;

  // Android: open the Play Store APP, not its web page. In-app browsers (X,
  // Instagram, ...) load a scripted redirect to play.google.com as a web page,
  // and that page asks the visitor to sign in to Google before installing.
  // An intent:// URL hands the link to the Play Store app; browser_fallback_url
  // is where Chrome goes if the app cannot take it. The referrer rides along.
  var playIntent = "intent://details?id=" + PLAY_ID + "&referrer=" + referrer +
                   "#Intent;scheme=market;package=com.android.vending;" +
                   "S.browser_fallback_url=" + encodeURIComponent(playUrl) + ";end";

  // In-app browsers are WebViews, and X's hands any non-web URL straight to
  // ACTION_VIEW without parsing it: an intent:// URL there ends in "no app can
  // perform this action" (seen 2026-11-14, X on a Galaxy). market:// is a URL
  // the Play Store app itself answers to, so that is what they get. Chrome keeps
  // intent://, whose fallback covers a phone without the Play Store.
  var inApp = /; wv\)/.test(ua) || /Twitter|FBAN|FBAV|Instagram|Line\//i.test(ua);
  var playMarket = "market://details?id=" + PLAY_ID + "&referrer=" + referrer;
  var playApp = inApp ? playMarket : playIntent;

  document.getElementById("androidLink").href = isAndroid ? playApp : playUrl;
  document.getElementById("iosLink").href = APPSTORE_URL;

  function showButtons(msg) {
    document.getElementById("fallback").style.display = "block";
    document.querySelector("p").textContent = msg;
  }

  if (isAndroid) {
    location.href = playApp;
    // Some in-app browsers drop a redirect nobody tapped for; a tap gets through.
    setTimeout(function () {
      document.getElementById("iosLink").style.display = "none";
      showButtons(inApp ? msg.tapInApp : msg.tap);
    }, 1500);
  } else if (isIOS && APPSTORE_URL.indexOf("http") === 0) {
    location.replace(APPSTORE_URL);
  } else {
    // Desktop / unknown: show both buttons instead of guessing.
    showButtons(msg.choose);
  }
})();
</script>
</body>
</html>
